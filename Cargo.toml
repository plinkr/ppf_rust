[package]
name = "ppf_rust"
version = "0.1.1"
edition = "2024"

[lib]
name = "ppf_rust"
path = "src/lib.rs"

[[bin]]
name = "ppf_cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
