name: Release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version name (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (GNU)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_type: tar.gz
            exe_ext: ""
            strip: true

          # Windows x86_64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_type: zip
            exe_ext: ".exe"
            strip: false

          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_type: tar.gz
            exe_ext: ""
            strip: true

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_type: tar.gz
            exe_ext: ""
            strip: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binaries (CLI & GUI)
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin ppf_cli --bin ppf_gui

      - name: Strip debug symbols (Linux & macOS)
        if: matrix.strip
        shell: bash
        run: |
          strip "target/${{ matrix.target }}/release/ppf_cli" || true
          strip "target/${{ matrix.target }}/release/ppf_gui" || true

      - name: Package artifacts
        shell: bash
        run: |
          set -e

          # Determine version/tag
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi

          ARCHIVE_NAME="ppf-${TAG}-${{ matrix.target }}"
          ARCHIVE_DIR="dist/${ARCHIVE_NAME}"
          mkdir -p "${ARCHIVE_DIR}"

          # Copy binaries
          cp "target/${{ matrix.target }}/release/ppf_cli${{ matrix.exe_ext }}" "${ARCHIVE_DIR}/"
          cp "target/${{ matrix.target }}/release/ppf_gui${{ matrix.exe_ext }}" "${ARCHIVE_DIR}/"

          # Copy documentation and license
          for doc in README.md README_ES.md LICENSE; do
            if [ -f "$doc" ]; then
              cp "$doc" "${ARCHIVE_DIR}/"
            fi
          done

          # Create archive
          cd dist
          if [ "${{ matrix.archive_type }}" = "zip" ]; then
            7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            ARCHIVE_FILE="${ARCHIVE_NAME}.zip"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            ARCHIVE_FILE="${ARCHIVE_NAME}.tar.gz"
          fi

          # Generate SHA256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          fi

          # Remove staging folder
          rm -rf "${ARCHIVE_NAME}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist

      - name: Generate consolidated SHA256 checksums
        shell: bash
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.event.inputs.tag_name, '-alpha') || contains(github.event.inputs.tag_name, '-beta') || contains(github.event.inputs.tag_name, '-rc') }}
