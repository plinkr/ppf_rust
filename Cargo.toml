[workspace]
members = [
    "crates/ppf-core",
    "crates/ppf-cli",
    "crates/ppf-gui",
    "crates/ppf-wasm",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Aliet Exposito"]
license = "MIT"
repository = "https://github.com/plinkr/ppf_rust"

[workspace.dependencies]
ppf-core = { path = "crates/ppf-core" }
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.218", features = ["derive"] }
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "0.6.5"
js-sys = "=0.3.77"
memmap2 = "0.9.11"
rayon = "1.12.0"
clap = { version = "4.6.6", features = ["derive"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29.1"
rfd = "0.15.2"
tempfile = "3.27.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
